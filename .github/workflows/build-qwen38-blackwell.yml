name: Build Qwen3.8 Blackwell runtime

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit to build
        required: true
        default: qwen38-blackwell-256k
        type: string
      package:
        description: Profile package to publish
        required: true
        default: both
        type: choice
        options:
          - both
          - hot-88k
          - ring-256k

permissions:
  actions: write
  contents: read

concurrency:
  group: qwen38-blackwell-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-sm120:
    name: Windows CUDA 13.3 sm_120a
    runs-on: windows-2022

    steps:
      - name: Check out custom source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: qwen38-blackwell-windows-cuda-13.3-sm120

      - name: Install CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: "13.3"
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Configure
        shell: cmd
        run: >-
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          && cmake -S . -B build-blackwell -G "Ninja Multi-Config"
          -DGGML_CUDA=ON
          -DGGML_CUDA_FA_ALL_QUANTS=ON
          -DGGML_CUDA_GRAPHS=ON
          -DGGML_CUDA_FORCE_CUBLAS=OFF
          -DGGML_CUDA_FORCE_MMQ=OFF
          -DGGML_NATIVE=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DCMAKE_CUDA_ARCHITECTURES=120a-real

      - name: Build server
        shell: cmd
        run: >-
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          && cmake --build build-blackwell --config Release --target llama-server --parallel 4

      - name: Validate custom runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $server = "build-blackwell\bin\Release\llama-server-mtpctx.exe"
          if (-not (Test-Path -LiteralPath $server -PathType Leaf)) {
              throw "Custom server was not produced: $server"
          }
          if ((Get-Item -LiteralPath $server).Length -le 0) {
              throw "Custom server is empty: $server"
          }

          $header = [System.IO.File]::ReadAllBytes($server)
          if ($header.Length -lt 2 -or $header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
              throw "Custom server is not a valid Windows PE file: $server"
          }

          $runtimeDirectory = Split-Path -Parent $server
          $requiredDlls = @(
              "ggml-base.dll",
              "ggml-cpu.dll",
              "ggml-cuda.dll",
              "ggml.dll",
              "llama-common.dll",
              "llama-server-impl.dll",
              "llama.dll",
              "mtmd.dll"
          )
          foreach ($requiredDll in $requiredDlls) {
              $dll = Join-Path $runtimeDirectory $requiredDll
              if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
                  throw "Required runtime DLL was not produced: $dll"
              }
          }

          $argumentSource = Get-Content -LiteralPath "common\arg.cpp" -Raw
          foreach ($requiredOption in @("--ctx-checkpoints", "--spec-type", "--reasoning-preserve")) {
              if ($argumentSource -notmatch [regex]::Escape($requiredOption)) {
                  throw "Required option missing from compiled source: $requiredOption"
              }
              Write-Host "validated option: $requiredOption"
          }

          Get-ChildItem -LiteralPath $runtimeDirectory -File |
              Sort-Object Name |
              ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  Write-Host "$hash  $($_.Name)"
              }

      - name: Assemble profile packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Resolve-Path "build-blackwell\bin\Release"
          $examples = Resolve-Path "examples\qwen38-blackwell"
          New-Item -ItemType Directory -Force "artifacts" | Out-Null

          foreach ($profile in @("hot-88k", "ring-256k")) {
              $destination = Join-Path "artifacts" "qwen38-blackwell-$profile"
              New-Item -ItemType Directory -Force $destination | Out-Null
              Copy-Item -Path (Join-Path $bin "*") -Destination $destination -Recurse
              Copy-Item -LiteralPath (Join-Path $examples "start-server.ps1") -Destination $destination
              Copy-Item -LiteralPath (Join-Path $examples "start-$profile.ps1") -Destination $destination
              Copy-Item -LiteralPath (Join-Path $examples "README.md") -Destination $destination

              Get-ChildItem -LiteralPath $destination -File |
                  Sort-Object Name |
                  ForEach-Object {
                      $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                      "$hash *$($_.Name)"
                  } |
                  Set-Content -LiteralPath (Join-Path $destination "SHA256SUMS.txt") -Encoding ascii
          }

      - name: Upload 88K hot package
        if: inputs.package == 'both' || inputs.package == 'hot-88k'
        uses: actions/upload-artifact@v6
        with:
          name: qwen38-blackwell-hot-88k-windows-sm120
          path: artifacts/qwen38-blackwell-hot-88k
          if-no-files-found: error
          compression-level: 9

      - name: Upload 256K ring package
        if: inputs.package == 'both' || inputs.package == 'ring-256k'
        uses: actions/upload-artifact@v6
        with:
          name: qwen38-blackwell-ring-256k-windows-sm120
          path: artifacts/qwen38-blackwell-ring-256k
          if-no-files-found: error
          compression-level: 9
